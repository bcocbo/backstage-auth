<svg xmlns="http://www.w3.org/2000/svg" width="760" height="322" viewBox="0 0 760 322" font-family="Segoe UI, Arial, sans-serif" role="img">
  <title>La pregunta solo llega al MCP que el agente eligió</title>
  <desc>Usuario, agente, modelo, Cognito, Istio y dos MCPs: el elegido responde (200) y el no elegido queda bloqueado (403).</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#888780"/>
    </marker>
  </defs>
  <rect width="760" height="322" fill="#ffffff"/>
  <text x="24" y="32" font-size="15" font-weight="600" fill="#2C2C2A">La pregunta solo llega al MCP que el agente eligió</text>
  <text x="24" y="54" font-size="11.5" fill="#5F5E5A">El token del agente trae solo los permisos marcados en la plantilla; Istio revisa cada llamada</text>
  <g fill="none" stroke="#888780" stroke-width="1.25">
    <path d="M164 140H204" marker-end="url(#arrow)"/>
    <path d="M344 140H384" marker-end="url(#arrow)"/>
    <path d="M524 140H576" marker-end="url(#arrow)"/>
    <path d="M454 166V272H576" marker-end="url(#arrow)"/>
    <path d="M224 166V246" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M324 166V246" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  </g>
  <g fill="none" stroke="#B4B2A9" stroke-width="1.25">
    <rect x="24" y="114" width="140" height="52" rx="8"/>
    <rect x="384" y="114" width="140" height="52" rx="8"/>
    <rect x="114" y="246" width="140" height="52" rx="8"/>
    <rect x="294" y="246" width="140" height="52" rx="8"/>
  </g>
  <rect x="204" y="114" width="140" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="2"/>
  <rect x="576" y="114" width="140" height="52" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="2"/>
  <rect x="576" y="246" width="140" height="52" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="2"/>
  <g font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="middle">
    <text x="94" y="136">Usuario</text>
    <text x="274" y="136">Agente</text>
    <text x="454" y="136">Istio</text>
    <text x="646" y="136">MCP productos</text>
    <text x="646" y="268">MCP cartera</text>
    <text x="184" y="268">Modelo (LLM)</text>
    <text x="364" y="268">Cognito</text>
  </g>
  <g font-size="11.5" fill="#5F5E5A" text-anchor="middle">
    <text x="94" y="154">hace una pregunta</text>
    <text x="274" y="154">decide qué tool usar</text>
    <text x="454" y="154">revisa el permiso</text>
    <text x="646" y="154">elegido: responde</text>
    <text x="646" y="286">no elegido: bloqueado</text>
    <text x="184" y="286">entiende y redacta</text>
    <text x="364" y="286">entrega el token</text>
    <text x="184" y="104">1. pregunta</text>
    <text x="364" y="104">3. llama con token</text>
    <text x="550" y="104">4. pasa (200)</text>
    <text x="515" y="264">4. bloquea (403)</text>
    <text x="216" y="210" text-anchor="end">2. razona</text>
    <text x="332" y="210" text-anchor="start">2. pide token</text>
  </g>
</svg>
