apiVersion: apps/v1
kind: Deployment
metadata: { name: gw-consulta-productos-smcp, namespace: harness-poc, labels: { app: gw-consulta-productos-smcp, harness.poc/rol: gateway } }
spec:
  replicas: 1
  selector: { matchLabels: { app: gw-consulta-productos-smcp } }
  template:
    metadata:
      labels: { app: gw-consulta-productos-smcp, harness.poc/rol: gateway }
      annotations:
        proxy.istio.io/config: '{ "holdApplicationUntilProxyStarts": true }'
    spec:
      serviceAccountName: mcp-gateway
      containers:
        - name: agentgateway
          image: cr.agentgateway.dev/agentgateway:v1.7.0
          args: ["-f", "/config/consulta-productos-smcp.yaml"]
          env: [{ name: HOME, value: /tmp }]
          ports: [{ containerPort: 3000 }]
          resources: { requests: { cpu: 20m, memory: 32Mi }, limits: { cpu: 300m, memory: 128Mi } }
          volumeMounts: [{ name: config, mountPath: /config }]
      volumes:
        - name: config
          configMap: { name: mcp-gateway-config }
---
apiVersion: v1
kind: Service
metadata: { name: gw-consulta-productos-smcp, namespace: harness-poc }
spec:
  selector: { app: gw-consulta-productos-smcp }
  ports: [{ name: http, port: 80, targetPort: 3000, appProtocol: http }]
