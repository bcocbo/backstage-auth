# Plantilla "Agente con Harness" (PoC Agent Harness).
# Arma un agente con piezas del Catálogo IA y genera un repo con su harness.yaml y su blueprint de accesos.
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: agente-con-harness
  title: Agente con Harness
  description: Arma un agente pro-code o low-code con modelo, MCPs, tools, skills, bases de conocimiento y agentes del catálogo, y genera su repo con harness y blueprint de accesos
  tags: [agent, harness, poc]
spec:
  owner: group:guests
  type: agent

  parameters:
    - title: Datos del agente
      required: [nombre, descripcion, codigoApp, owner]
      properties:
        nombre:
          title: Nombre
          type: string
          description: Minúsculas y guiones (ej. agente-cobranza). En el catálogo queda con el sufijo _aiagent
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          ui:autofocus: true
        descripcion:
          title: Propósito
          type: string
          description: Qué hace el agente, en una frase
        codigoApp:
          title: Código de aplicación
          type: string
          description: Código del inventario de aplicaciones (ej. POC0000110); nombra el App Client del agente
          pattern: '^[A-Z]{2,3}[0-9]{7}$'
        owner:
          title: Equipo dueño
          type: string
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group

    - title: Tipo de agente
      required: [tipoAgente]
      properties:
        tipoAgente:
          title: Tipo de agente
          type: string
          enum: [pro-code, low-code]
          enumNames: ['Pro-code (código, ej. LangGraph)', 'Low-code (plataforma visual, ej. n8n)']
          default: pro-code
          ui:widget: radio
      dependencies:
        tipoAgente:
          oneOf:
            - properties:
                tipoAgente:
                  const: pro-code
                runtime:
                  title: Framework
                  type: string
                  enum: [langgraph, sdk-propio]
                  enumNames: ['LangGraph', 'SDK propio']
                  default: langgraph
            - properties:
                tipoAgente:
                  const: low-code
                runtime:
                  title: Plataforma
                  type: string
                  enum: [n8n]
                  enumNames: ['n8n']
                  default: n8n

    - title: Piezas del catálogo
      required: [modelo, mcps]
      properties:
        modelo:
          title: Modelo
          type: string
          description: Modelo que usará el agente (a través del LLM Gateway)
          ui:field: EntityPicker
          ui:options:
            allowArbitraryValues: false
            catalogFilter:
              kind: Resource
              spec.type: llm-model
        mcps:
          title: MCPs
          type: array
          items:
            type: string
          description: Cada MCP da un scope al App Client del agente (a través del MCP Gateway)
          ui:field: MultiEntityPicker
          ui:options:
            catalogFilter:
              kind: Component
              spec.type: mcp
        tools:
          title: Tools específicas (opcional)
          type: array
          items:
            type: string
          description: Limita el acceso a estas tools. Si no eliges ninguna, el agente recibe el MCP completo
          ui:field: MultiEntityPicker
          ui:options:
            catalogFilter:
              kind: Component
              spec.type: tool
        skills:
          title: Skills
          type: array
          items:
            type: string
          ui:field: MultiEntityPicker
          ui:options:
            catalogFilter:
              kind: Component
              spec.type: skill
        basesConocimiento:
          title: Bases de conocimiento
          type: array
          items:
            type: string
          ui:field: MultiEntityPicker
          ui:options:
            catalogFilter:
              kind: Resource
              spec.type: knowledge-base
        agentes:
          title: Otros agentes que puede invocar
          type: array
          items:
            type: string
          ui:field: MultiEntityPicker
          ui:options:
            catalogFilter:
              kind: Component
              spec.type: agent

    - title: Repositorio
      required: [repoUrl]
      properties:
        repoUrl:
          title: Dónde crear el repo
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

  steps:
    # Trae las fichas de los MCPs para leer el scope que pide cada uno.
    - id: fichas-mcps
      name: Leer fichas de los MCPs
      action: catalog:fetch
      input:
        entityRefs: ${{ parameters.mcps }}

    # Trae las fichas de las tools elegidas para leer su acción (lectura, escritura, con aprobación).
    - id: fichas-tools
      name: Leer fichas de las tools
      if: ${{ parameters.tools and parameters.tools.length > 0 }}
      action: catalog:fetch
      input:
        entityRefs: ${{ parameters.tools }}

    - id: base
      name: Generar harness y blueprint de accesos
      action: fetch:template
      input:
        url: ./skeleton/base
        values:
          nombre: ${{ parameters.nombre }}
          entidad: ${{ parameters.nombre }}_aiagent
          descripcion: ${{ parameters.descripcion }}
          codigoApp: ${{ parameters.codigoApp }}
          owner: ${{ parameters.owner }}
          tipoAgente: ${{ parameters.tipoAgente }}
          runtime: ${{ parameters.runtime }}
          modelo: ${{ parameters.modelo }}
          mcps: ${{ steps['fichas-mcps'].output.entities }}
          tools: ${{ steps['fichas-tools'].output.entities or [] }}
          skills: ${{ parameters.skills or [] }}
          basesConocimiento: ${{ parameters.basesConocimiento or [] }}
          agentes: ${{ parameters.agentes or [] }}

    - id: pro-code
      name: Generar esqueleto pro-code
      if: ${{ parameters.tipoAgente === 'pro-code' }}
      action: fetch:template
      input:
        url: ./skeleton/pro-code
        targetPath: ./agente
        values:
          nombre: ${{ parameters.nombre }}
          runtime: ${{ parameters.runtime }}

    - id: low-code
      name: Generar configuración low-code
      if: ${{ parameters.tipoAgente === 'low-code' }}
      action: fetch:template
      input:
        url: ./skeleton/low-code
        targetPath: ./agente
        values:
          nombre: ${{ parameters.nombre }}
          runtime: ${{ parameters.runtime }}

    - id: publish
      name: Crear repo en GitHub
      action: publish:github
      input:
        description: ${{ parameters.descripcion }}
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main
        repoVisibility: private

    - id: register
      name: Registrar el agente en el catálogo
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: Repositorio
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Ver en el catálogo
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
