apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.entidad }}
  description: ${{ values.descripcion }}
  tags: [agent, ${{ values.tipoAgente }}]
  labels:
    harness.poc/tipo-agente: ${{ values.tipoAgente }}
    harness.poc/runtime: ${{ values.runtime }}
    harness.poc/estado: dentro-del-harness
    harness.poc/codigo-app: ${{ values.codigoApp }}
  annotations:
    harness.poc/manifest: ./harness.yaml
    harness.poc/blueprint-accesos: ./blueprint-accesos.yaml
    backstage.io/kubernetes-id: ${{ values.entidad }}
    backstage.io/kubernetes-namespace: harness-poc
spec:
  type: agent
  lifecycle: development
  owner: ${{ values.owner }}
  system: harness-poc
  dependsOn:
    - ${{ values.modelo }}
{%- for mcp in values.mcps %}
    - component:${{ mcp.metadata.namespace }}/${{ mcp.metadata.name }}
{%- endfor %}
{%- for ref in values.skills %}
    - ${{ ref }}
{%- endfor %}
{%- for ref in values.basesConocimiento %}
    - ${{ ref }}
{%- endfor %}
{%- for ref in values.agentes %}
    - ${{ ref }}
{%- endfor %}
