# Agentes de ejemplo (ficticios), ya armados con piezas del catálogo.
# Sirven como legos (un agente puede invocar a otro) y como referencia de cada caso.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: agente-atencion-cliente
  title: Agente Atención al cliente
  description: Responde consultas de productos y radica PQR
  tags: [agente, pro-code, caso-atencion-cliente]
  labels:
    harness.poc/tipo-agente: pro-code
    harness.poc/estado: dentro-del-harness
spec:
  type: agent
  lifecycle: experimental
  owner: group:guests
  system: harness-poc
  consumesApis: [api:mcp-consulta-productos, api:mcp-clientes, api:mcp-pqr]
  dependsOn:
    - resource:modelo-razonamiento-general
    - resource:skill-respuesta-clientes
    - resource:kb-portafolio-productos
