apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: mcp-consulta-productos
  title: MCP Consulta de productos
  description: Tools de solo lectura para consultar el portafolio de productos (ficticio)
  tags: [mcp, solo-lectura]
  labels:
    harness.poc/scope: mcp.consulta-productos.read
spec:
  type: mcp
  lifecycle: experimental
  owner: group:guests
  system: harness-poc
  definition: |
    tools:
      - buscar_producto: busca productos por nombre o código
      - detalle_producto: devuelve las características de un producto
