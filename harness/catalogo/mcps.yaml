# MCPs de ejemplo (ficticios). Cada MCP declara el scope que pide y su sensibilidad;
# sus tools están en tools.yaml como piezas separadas (permiso de grano fino).
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: mcp-consulta-productos
  title: MCP Consulta de productos
  description: Consulta del portafolio de productos
  tags: [mcp, solo-lectura, caso-atencion-cliente]
  labels:
    harness.poc/scope: mcp.consulta-productos.read
    harness.poc/sensibilidad: baja
spec:
  type: mcp
  lifecycle: experimental
  owner: group:guests
  system: harness-poc
  definition: |
    tools: [buscar_producto, detalle_producto]
---
