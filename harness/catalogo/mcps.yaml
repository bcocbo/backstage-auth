  title: MCP Gestión de tickets
  description: Tools para consultar y crear tickets de soporte (ficticio)
  tags: [mcp, escritura]
  labels:
    harness.poc/scope: mcp.gestion-tickets.write
spec:
  type: mcp
  lifecycle: experimental
  owner: group:guests
  system: harness-poc
  definition: |
    tools:
      - consultar_ticket: devuelve el estado de un ticket
      - crear_ticket: crea un ticket nuevo (acción que requiere aprobación)
