# MCPs con la forma del Catálogo IA de Kaizen. harness.poc/origen: real = código real desplegado; simulado = datos inventados.
# Los simulados tienen nombres y descripciones genéricos; la cantidad de tools y sus parámetros imitan a MCPs reales.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: kubernetes-mcp-server
  title: "Kubernetes"
  description: "REAL: código real desplegado en la PoC. Diagnóstico de cargas en Kubernetes: pods, logs, eventos, recursos e Istio. En la PoC solo lee el namespace harness-poc. Corre en nuestro clúster."
  tags: [mcp, mcp-kaizen, real]
  annotations:
    server-url: http://kubernetes-smcp.harness-poc.svc.cluster.local/mcp
    mcp.io/server-type: streamable-http
  labels:
    harness.poc/origen: real
    harness.poc/dependencia: cluster
spec:
  type: mcp
  lifecycle: experimental
  owner: group:guests
  system: harness-poc
  providesApis: [kubernetes-mcp-server-api]
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: kubernetes-mcp-server-api
  title: "API de Kubernetes"
  description: "Tools del MCP kubernetes-mcp-server (real)."
  tags: [mcp, real]
  annotations:
    server-url: http://kubernetes-smcp.harness-poc.svc.cluster.local/mcp
spec:
  type: mcp
  lifecycle: experimental
  owner: group:guests
  system: harness-poc
  definition: |
    # Kubernetes (real)
    10 tools.

    ### kubernetes_list_pods
    Kubernetes list pods.
    **Parámetros**:
      - `cluster_name` (string)
      - `namespace` (string)
      - `label_selector` (string, opcional)
      - `limit` (integer, opcional)

    ### kubernetes_get_pod
    Kubernetes get pod.
    **Parámetros**:
      - `cluster_name` (string)
      - `name` (string)
      - `namespace` (string)

    ### kubernetes_get_pod_logs
    Kubernetes get pod logs.
    **Parámetros**:
      - `cluster_name` (string)
      - `pod_name` (string)
      - `namespace` (string)
      - `container` (string, opcional)
      - `tail_lines` (integer, opcional)
      - `since_seconds` (integer, opcional)

    ### kubernetes_list_nodes
    Kubernetes list nodes.
    **Parámetros**:
      - `cluster_name` (string)

    ### kubernetes_list_namespaces
    Kubernetes list namespaces.
    **Parámetros**:
      - `cluster_name` (string)

    ### kubernetes_list_resources
    Kubernetes list resources.
    **Parámetros**:
      - `cluster_name` (string)
      - `resource_type` (string)
      - `namespace` (string)
      - `label_selector` (string, opcional)

    ### kubernetes_get_events
    Kubernetes get events.
    **Parámetros**:
      - `cluster_name` (string)
      - `namespace` (string)

    ### kubernetes_top_pods
    Kubernetes top pods.
    **Parámetros**:
      - `cluster_name` (string)
      - `namespace` (string)
      - `name` (string, opcional)
      - `label_selector` (string, opcional)
      - `containers` (boolean, opcional)
      - `sort_by` (string, opcional)

    ### istio_list_resources
    Istio list resources.
    **Parámetros**:
      - `cluster_name` (string)
      - `resource_kind` (string)
      - `namespace` (string)
      - `name` (string, opcional)
      - `label_selector` (string, opcional)

    ### kubernetes_list_clusters
    Kubernetes list clusters.

---
