# Agente atencion-prueba_aiagent. Identidad (App Client de Cognito) en el Secret atencion-prueba-identidad;
# el código va en el ConfigMap agente-atencion-prueba-codigo creado por desplegar.ps1.
apiVersion: v1
kind: ConfigMap
metadata: { name: agente-atencion-prueba-config, namespace: harness-poc }
data:
  AGENT_NAME: atencion-prueba_aiagent
  LLM_BASE_URL: http://llm-gateway-poc/v1
  LLM_MODEL: qwen2.5:7b
  SCOPES: consumo-mcps/productos-consultaProductos consumo-mcps/clientes-consultaClientes consumo-mcps/servicio-gestionPqr
  MCP_URLS: '{"consulta-productos_smcp": "http://consulta-productos-smcp/mcp"}'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atencion-prueba-aiagent
  namespace: harness-poc
  labels: { app: atencion-prueba-aiagent, harness.poc/tipo: agent, backstage.io/kubernetes-id: atencion-prueba_aiagent }
spec:
  replicas: 1
  selector: { matchLabels: { app: atencion-prueba-aiagent } }
  template:
    metadata:
      labels: { app: atencion-prueba-aiagent, pod: atencion-prueba-aiagent, backstage.io/kubernetes-id: atencion-prueba_aiagent }
      annotations:
        proxy.istio.io/config: '{ "holdApplicationUntilProxyStarts": true }'
    spec:
      containers:
        - name: agente
          image: python:3.12-slim
          command: ["/bin/sh", "-c", "pip install --no-cache-dir -q fastapi 'uvicorn[standard]' httpx 'langgraph>=1.0' 'langchain-openai>=0.3' 'langchain-mcp-adapters>=0.1.9' && cd /app && uvicorn app:app --host 0.0.0.0 --port 8080"]
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: agente-atencion-prueba-config }
            - secretRef: { name: atencion-prueba-identidad }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
          resources: { requests: { cpu: 200m, memory: 512Mi }, limits: { cpu: "1", memory: 1Gi } }
          volumeMounts: [{ name: codigo, mountPath: /app }]
      volumes:
        - name: codigo
          configMap: { name: agente-atencion-prueba-codigo }
---
apiVersion: v1
kind: Service
metadata: { name: atencion-prueba-aiagent, namespace: harness-poc }
spec:
  selector: { app: atencion-prueba-aiagent }
  ports: [{ name: http, port: 80, targetPort: 8080 }]
