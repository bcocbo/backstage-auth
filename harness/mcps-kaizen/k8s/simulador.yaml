# Simulador de los MCP internos: un solo pod publica cada uno en /<mcp>/mcp con sus tools reales y datos inventados.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-simulador
  namespace: harness-poc
  labels: { app: mcp-simulador, harness.poc/tipo: mcp, harness.poc/origen: simulado }
spec:
  replicas: 1
  selector: { matchLabels: { app: mcp-simulador } }
  template:
    metadata:
      labels: { app: mcp-simulador, harness.poc/origen: simulado }
      annotations:
        proxy.istio.io/config: '{ "holdApplicationUntilProxyStarts": true }'
    spec:
      containers:
        - name: simulador
          image: python:3.12-slim
          command: ["/bin/sh", "-c", "pip install --no-cache-dir -q 'mcp>=1.12,<2' uvicorn && python /app/servidor.py"]
          ports: [{ containerPort: 8080 }]
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { cpu: 500m, memory: 384Mi } }
          readinessProbe: { httpGet: { path: /health, port: 8080 }, initialDelaySeconds: 20, periodSeconds: 10 }
          volumeMounts: [{ name: codigo, mountPath: /app }]
      volumes:
        - name: codigo
          configMap: { name: mcp-simulador-codigo }
---
apiVersion: v1
kind: Service
metadata: { name: mcp-simulador, namespace: harness-poc }
spec:
  selector: { app: mcp-simulador }
  ports: [{ name: http-mcp, port: 80, targetPort: 8080 }]
